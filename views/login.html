<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión - FitZone</title>
        <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234b1c71'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23dbb6ee' font-family='Arial, sans-serif' font-weight='bold'>F</text></svg>">
        <link rel="stylesheet" href="/css/style.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <script src="/js/alerts.js"></script>
    </head>
    <body>
        <!-- Header simple -->
        <header class="header">
            <nav class="navbar">
                <div class="nav-container">
                    <a href="/" class="logo" style="text-decoration: none; color: inherit; display: flex; align-items: center; cursor: pointer;">
                        <i class="fas fa-dumbbell"></i>
                        <span>FitZone</span>
                    </a>
                    <ul class="nav-menu">
                        <li><a href="/">Volver al Inicio</a></li>
                        <li><a href="/login-empleado" style="color: #3b82f6; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-user-tie"></i> Acceso Empleados
                        </a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Formulario de Login -->
        <main class="login-main">
            <div class="login-container">
                <div class="login-box">
                    <div class="login-header">
                        <i class="fas fa-user-circle"></i>
                        <h2>Iniciar Sesión</h2>
                        <p>Accede a tu cuenta de FitZone</p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="input-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <button type="submit" class="btn-login-form">Iniciar Sesión</button>
                    </form>

                    <div class="login-footer">
                        <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </main>

        <script>
            // ==================== LOGIN CON VALIDACIÓN DE CONTRASEÑA TEMPORAL ====================
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const submitBtn = document.querySelector('.btn-login-form');
                
                if (!email || !password) {
                    showToast('warning', 'Por favor completa todos los campos');
                    return;
                }
                
                // Deshabilitar botón durante la petición
                submitBtn.disabled = true;
                submitBtn.textContent = 'Iniciando sesión...';
                
                try {
                    console.log('📤 Enviando login...');
                    
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ email, password })
                    });
                    
                    const result = await response.json();
                    console.log('📥 Respuesta del servidor:', result);
                    
                    if (result.success) {
                        // ⭐ CRÍTICO: Verificar si requiere cambio de contraseña
                        if (result.requiresPasswordChange === true) {
                            console.log('⚠️ Usuario requiere cambio de contraseña temporal');
                            
                            // Guardar info temporal
                            localStorage.setItem('tempPasswordUser', JSON.stringify({
                                userId: result.userId,
                                email: result.user.email || email,
                                fullName: result.user.fullName || 'Usuario'
                            }));
                            
                             // Mostrar alerta y redirigir
                            if (typeof showCustomAlert === 'function') {
                                showCustomAlert('warning', 'Cambio de Contraseña Requerido', 
                                    'Debes cambiar tu contraseña temporal antes de continuar.', 
                                    () => {
                                        window.location.href = '/change-password';
                                    }
                                );
                            } else {
                                alert('Debes cambiar tu contraseña temporal');
                                window.location.href = '/change-password';
                            }
                            return; // IMPORTANTE: No continuar con el flujo normal
                        }
                        
                        // Si no requiere cambio de contraseña, continuar con el flujo normal
                        console.log('✅ Login exitoso, redirigiendo...');
                        
                        // Verificar estado de membresía
                        try {
                            const membershipCheck = await fetch('/api/check-membership-status', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                credentials: 'same-origin',
                                body: JSON.stringify({ userId: result.userId })
                            });
                            
                            const membershipStatus = await membershipCheck.json();
                            
                            // Si la membresía está expirada, bloquear acceso
                            if (membershipStatus.membershipStatus === 'expired') {
                                showToast('error', `Tu membresía ha expirado. Por favor renueva para continuar.`, 6000);
                                
                                // Cerrar la sesión
                                await fetch('/api/logout', { 
                                    method: 'POST',
                                    credentials: 'same-origin'
                                });
                                
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Iniciar Sesión';
                                return;
                            }
                            
                            // Si está por vencer, mostrar advertencia
                            if (membershipStatus.membershipStatus === 'expiring_soon') {
                                showToast('warning', `Tu membresía vence en ${membershipStatus.daysRemaining} días. Renuévala pronto.`, 5000);
                            }
                        } catch (membershipError) {
                            console.log('⚠️ No se pudo verificar membresía:', membershipError);
                            // Continuar con el login normal
                        }
                        
                        // Login exitoso - redirigir
                        showToast('success', `¡Bienvenido ${result.user.fullName || 'a FitZone'}!`);
                        
                        setTimeout(() => {
                            window.location.href = result.redirectUrl || '/dashboard';
                        }, 1000);
                        
                    } else {
                        // Login fallido
                        console.error('❌ Login fallido:', result.message);
                        showToast('error', result.message || 'Credenciales incorrectas');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Iniciar Sesión';
                    }
                    
                } catch (error) {
                    console.error('❌ Error de conexión:', error);
                    showToast('error', 'Error de conexión. Intenta nuevamente.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Iniciar Sesión';
                }
            });

            console.log('✅ Login cargado correctamente');
        </script>
    </body>
</html>
