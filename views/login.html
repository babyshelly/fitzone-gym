<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión - FitZone</title>
        <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234b1c71'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23dbb6ee' font-family='Arial, sans-serif' font-weight='bold'>F</text></svg>">
        <link rel="stylesheet" href="/css/style.css">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
        <style>
            .error-message {
                color: #ef4444;
                font-size: 0.9rem;
                margin-top: 0.5rem;
                display: none;
                text-align: center;
            }
            
            .error-message.show {
                display: block;
            }
        </style>
    </head>
    <body>
        <!-- Header simple -->
        <header class="header">
            <nav class="navbar">
                <div class="nav-container">
                    <div class="logo">
                        <i class="fas fa-dumbbell"></i>
                        <span>FitZone</span>
                    </div>
                    <ul class="nav-menu">
                        <li><a href="/">Volver al Inicio</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Formulario de Login -->
        <main class="login-main">
            <div class="login-container">
                <div class="login-box">
                    <div class="login-header">
                        <i class="fas fa-user-circle"></i>
                        <h2>Iniciar Sesión</h2>
                        <p>Accede a tu cuenta de FitZone</p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="input-group">
                            <label for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" required>
                        </div>

                        <!-- Mensaje de error -->
                        <div id="error-message" class="error-message"></div>

                        <button type="submit" class="btn-login-form" id="submitBtn">
                            Iniciar Sesión
                        </button>
                    </form>

                    <div class="login-footer">
                        <p>¿No tienes cuenta? <a href="/register">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </main>
        
        <script>
            // Script para login sin alertas molestas
            document.getElementById('loginForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const submitBtn = document.getElementById('submitBtn');
                const errorMsg = document.getElementById('error-message');
                
                // Limpiar mensaje de error anterior
                errorMsg.classList.remove('show');
                errorMsg.textContent = '';
                
                if (!email || !password) {
                    errorMsg.textContent = 'Por favor completa todos los campos';
                    errorMsg.classList.add('show');
                    return;
                }
                
                // Deshabilitar botón y mostrar estado de carga
                submitBtn.disabled = true;
                submitBtn.textContent = 'Iniciando...';
                
                try {
                    // Intentar login
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    const result = await response.json();
                    
                    if (result.success) {
                        // Verificar estado de membresía
                        try {
                            const membershipCheck = await fetch('/api/check-membership-status', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({ userId: result.userId })
                            });
                            
                            const membershipStatus = await membershipCheck.json();
                            
                            // Si la membresía está expirada, bloquear acceso
                            if (membershipStatus.membershipStatus === 'expired') {
                                errorMsg.textContent = `Membresía expirada hace ${membershipStatus.daysExpired} días. Renueva para acceder.`;
                                errorMsg.classList.add('show');
                                
                                // Cerrar la sesión que se acabó de crear
                                await fetch('/api/logout', { method: 'POST' });
                                
                                submitBtn.disabled = false;
                                submitBtn.textContent = 'Iniciar Sesión';
                                return;
                            }
                        } catch (membershipError) {
                            console.log('No se pudo verificar membresía:', membershipError);
                        }
                        
                        // Login exitoso - redirigir directamente
                        window.location.href = result.redirectUrl || '/dashboard';
                        
                    } else {
                        // Mostrar error inline
                        errorMsg.textContent = 'Credenciales incorrectas';
                        errorMsg.classList.add('show');
                        submitBtn.disabled = false;
                        submitBtn.textContent = 'Iniciar Sesión';
                    }
                    
                } catch (error) {
                    console.error('Error:', error);
                    errorMsg.textContent = 'Error de conexión. Intenta nuevamente.';
                    errorMsg.classList.add('show');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Iniciar Sesión';
                }
            });
        </script>
    </body>
</html>
