<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - FitZone</title>
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234b1c71'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='%23dbb6ee' font-family='Arial, sans-serif' font-weight='bold'>F</text></svg>">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/alerts.js"></script>
</head>
<body>
    <!-- Main Content -->
    <main class="login-main" style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, var(--negro), var(--gris-oscuro));">
        <div class="login-container" style="max-width: 500px; width: 90%; background: var(--gris-oscuro); border-radius: 25px; border: 3px solid var(--violeta-medio); padding: 3rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);">
            <div class="login-box">
                <div class="login-header" style="text-align: center; margin-bottom: 2rem;">
                    <div style="background: linear-gradient(135deg, var(--violeta-medio), var(--violeta-oscuro)); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                        <i class="fas fa-key" style="font-size: 2.5rem; color: white;"></i>
                    </div>
                    <h2 style="color: var(--violeta-claro); font-size: 1.8rem; margin-bottom: 0.5rem;">Cambiar Contraseña Temporal</h2>
                    <p style="color: var(--gris-claro);">Por seguridad, debes cambiar tu contraseña temporal</p>
                </div>

                <form id="changePasswordForm">
                    <div class="input-group" style="margin-bottom: 1.5rem;">
                        <label style="color: var(--violeta-claro); font-weight: 600; margin-bottom: 0.5rem; display: block;">Nueva Contraseña *</label>
                        <input type="password" id="newPassword" required minlength="6" 
                               style="width: 100%; padding: 1rem; border: 2px solid var(--violeta-medio); border-radius: 10px; background: var(--negro); color: var(--blanco); font-size: 1rem;"
                               placeholder="Mínimo 6 caracteres">
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 2rem;">
                        <label style="color: var(--violeta-claro); font-weight: 600; margin-bottom: 0.5rem; display: block;">Confirmar Contraseña *</label>
                        <input type="password" id="confirmPassword" required 
                               style="width: 100%; padding: 1rem; border: 2px solid var(--violeta-medio); border-radius: 10px; background: var(--negro); color: var(--blanco); font-size: 1rem;"
                               placeholder="Repite tu contraseña">
                    </div>
                    
                    <button type="submit" class="btn-login-form" 
                            style="width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--violeta-medio), var(--violeta-oscuro)); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s;">
                        <i class="fas fa-check"></i> Cambiar Contraseña
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Verificar que viene de login
        const tempUser = JSON.parse(localStorage.getItem('tempPasswordUser') || '{}');
        
        if (!tempUser.userId) {
            console.log('⚠️ No hay usuario temporal, redirigiendo a login...');
            window.location.href = '/login';
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            // Validar contraseñas
            if (newPassword !== confirmPassword) {
                if (typeof showCustomAlert === 'function') {
                    showCustomAlert('error', 'Error', 'Las contraseñas no coinciden');
                } else {
                    alert('Las contraseñas no coinciden');
                }
                return;
            }
            
            if (newPassword.length < 6) {
                if (typeof showCustomAlert === 'function') {
                    showCustomAlert('warning', 'Contraseña Muy Corta', 'La contraseña debe tener al menos 6 caracteres');
                } else {
                    alert('La contraseña debe tener al menos 6 caracteres');
                }
                return;
            }
            
            try {
                console.log('📤 Enviando cambio de contraseña...');
                
                const response = await fetch('/api/change-temporary-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ 
                        userId: tempUser.userId, 
                        newPassword 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    console.log('✅ Contraseña cambiada exitosamente');
                    
                    // Limpiar localStorage
                    localStorage.removeItem('tempPasswordUser');
                    
                    if (typeof showCustomAlert === 'function') {
                        showCustomAlert('success', '¡Contraseña Cambiada!', 
                            'Tu contraseña ha sido actualizada correctamente', 
                            () => {
                                window.location.href = '/dashboard';
                            }
                        );
                    } else {
                        alert('¡Contraseña cambiada exitosamente!');
                        window.location.href = '/dashboard';
                    }
                } else {
                    console.error('❌ Error del servidor:', result.message);
                    
                    if (typeof showCustomAlert === 'function') {
                        showCustomAlert('error', 'Error', result.message || 'No se pudo cambiar la contraseña');
                    } else {
                        alert(result.message || 'Error al cambiar contraseña');
                    }
                }
            } catch (error) {
                console.error('❌ Error de conexión:', error);
                
                if (typeof showCustomAlert === 'function') {
                    showCustomAlert('error', 'Error de Conexión', 'No se pudo conectar con el servidor. Intenta nuevamente.');
                } else {
                    alert('Error de conexión. Intenta nuevamente.');
                }
            }
        });

        console.log('✅ Página de cambio de contraseña cargada');
    </script>
</body>
</html>
