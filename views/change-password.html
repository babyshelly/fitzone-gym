<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar Contraseña - FitZone</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/alerts.js"></script>
</head>
<body>
    <main class="login-main">
        <div class="login-container">
            <div class="login-box">
                <div class="login-header">
                    <i class="fas fa-key"></i>
                    <h2>Cambiar Contraseña Temporal</h2>
                    <p>Por seguridad, debes cambiar tu contraseña temporal</p>
                </div>

                <form id="changePasswordForm">
                    <div class="input-group">
                        <label>Nueva Contraseña</label>
                        <input type="password" id="newPassword" required minlength="6">
                    </div>
                    <div class="input-group">
                        <label>Confirmar Contraseña</label>
                        <input type="password" id="confirmPassword" required>
                    </div>
                    <button type="submit" class="btn-login-form">Cambiar Contraseña</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // Verificar que viene de login
        const tempUser = JSON.parse(localStorage.getItem('tempPasswordUser') || '{}');
        if (!tempUser.userId) {
            window.location.href = '/login';
        }

        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                showCustomAlert('error', 'Error', 'Las contraseñas no coinciden');
                return;
            }
            
            try {
                const response = await fetch('/api/change-temporary-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ 
                        userId: tempUser.userId, 
                        newPassword 
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    localStorage.removeItem('tempPasswordUser');
                    showCustomAlert('success', '¡Contraseña Cambiada!', 
                        'Tu contraseña ha sido actualizada correctamente', 
                        () => window.location.href = '/dashboard'
                    );
                } else {
                    showCustomAlert('error', 'Error', result.message);
                }
            } catch (error) {
                showCustomAlert('error', 'Error de Conexión', 'Intenta nuevamente');
            }
        });
    </script>
</body>
</html>
